<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xenon IFC Ventilation Checker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="backdrop"></div>
    <main class="page">
      <section class="panel controls-panel">
        <h1>Xenon Ventilation Studio</h1>
        <p class="subtitle">Drop an IFC model, preview it in 3D, generate the ventilation rule report, and email it instantly.</p>

        <div id="drop-zone" class="drop-zone">
          <p class="drop-title">Drag & drop .ifc file</p>
          <p class="drop-hint">or click to browse</p>
          <input id="ifc-input" type="file" accept=".ifc" />
        </div>

        <p id="selected-file" class="selected-file">No IFC selected</p>

        <label for="api-url">Backend API URL</label>
        <input id="api-url" type="text" value="http://localhost:8000" placeholder="http://localhost:8000" />

        <label for="emails">Recipient emails</label>
        <textarea
          id="emails"
          rows="3"
          placeholder="alice@example.com, bob@example.com"
        ></textarea>

        <label for="subject-prefix">Subject prefix</label>
        <input id="subject-prefix" type="text" value="Xenon Ventilation Report" />

        <button id="run-report" class="cta">Generate Report & Send Mail</button>
        <p id="status" class="status idle">Waiting for IFC file...</p>
      </section>

      <section class="panel viewer-panel">
        <div id="viewer-container" class="viewer-container"></div>

        <div id="report" class="report hidden">
          <h2>Ventilation Report</h2>
          <div id="report-grid" class="report-grid"></div>
          <pre id="report-text"></pre>
        </div>
      </section>
    </main>

    <script src="./vendor/ifc-viewer.bundle.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
